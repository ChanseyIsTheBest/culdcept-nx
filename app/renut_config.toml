# setjmp / longjmp (peggle2-nx's method, by shape; tools/ppc_dis.py; the same shapes as Beautiful Katamari's):
# setjmp 0x82652470 checks a hook word (`lis r4; lwz r0,30924(r4); bnectr`), then saves f14-f31 and r13-r31 into the
# buffer at r3 (`stfd f14,0(r3)` ... `std r13,152(r3)`); longjmp 0x82652230 reloads them from it (`mr r7,r3` ...
# `lfd f14,0(r7)`). 7 setjmp callers (0x823CB598 ... 0x82511418), 12+ longjmp callers (tools/ppc_callers.py).
setjmp_address = 0x82652470
longjmp_address = 0x82652230

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

