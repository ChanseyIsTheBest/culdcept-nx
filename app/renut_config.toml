# culdcept-nx (Culdcept Saga, title 424107DD, XDK 2.0.3424, D3D9LTCG) - ReXGlue codegen configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so the base's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are culdcept-nx (docs/culdcept-notes.md, "Decisions").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# The register "diet" keys (2026-11-19; docs/culdcept-notes.md, "Codegen options"). Audited on a codegen without them:
#   tools/non_argument_audit.py app/generated --noreturn=82391F50 (_CxxThrowException): ENTRY 298, RET 36 lines;
#   tools/diet_keep_list.py writes the keep list below. v64-v127 stay in ctx from the start (katamari-nx's rc3: a codec
#   keeping constants in VMX128 registers across its calls decoded green blocks with them as locals).
#   tools/read_before_write.py on code generated WITH the options: see config/renut_funcs.toml's share_registers.
#   Bisection 2 (2026-11-19, docs/culdcept-notes.md): the two register keys on, elide_lr_stores off: X4801 still.
#   Bisection 3: non_volatile_as_local alone: X4801. So non_volatile_as_local mistranslates something in the
#   compiler. Round 4: both register keys on everywhere except the run-time HLSL compiler (it runs at boot only):
#   the functions reached by direct calls from D3DXCompileShaderFromFile (sub_823A0488) and every function of its
#   dense blocks 0x823A0000-0x823F0000, 0x82420000-0x82440000, 0x82470000-0x82560000 (its virtual methods):
#   out/d3dx_compiler_set.txt, 3,457 functions (tools/diet_exclude_ranges.py), excluded from the first and kept by
#   the second. Round 5 (2026-11-19): less the 47 of them hot in gameplay (the emulator profile emu9 and the PC's
#   runA: shared helpers the compiler also calls): out/d3dx_compiler_set2.txt, 3,410 functions.
